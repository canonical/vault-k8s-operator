name: TiCS Static Analysis

on:
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 3 am
  workflow_dispatch: # Allows manual triggering

jobs:
  analyze-k8s:
    uses: canonical/identity-credentials-workflows/.github/workflows/tics-tox.yaml@348c9f1e6f1d3f12a0bf79f4230e0b64b1be43b3
    with:
      project: vault-k8s-operator
      dir: k8s
      fetch_libs: true
    secrets:
      TICSAUTHTOKEN: ${{ secrets.TICSAUTHTOKEN }}

  analyze-machine:
    uses: canonical/identity-credentials-workflows/.github/workflows/tics-tox.yaml@348c9f1e6f1d3f12a0bf79f4230e0b64b1be43b3
    with:
      project: vault-operator
      dir: machine
      fetch_libs: true
    secrets:
      TICSAUTHTOKEN: ${{ secrets.TICSAUTHTOKEN }}
