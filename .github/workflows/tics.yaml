name: TiCS Static Analysis

on:
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 3 am
  workflow_dispatch: # Allows manual triggering

jobs:
  analyze-k8s:
    uses: canonical/identity-credentials-workflows/.github/workflows/tics-tox.yaml@43bece1429ac5793954edd57ad8f7a41ae578ab8
    with:
      project: vault-k8s-operator
      dir: k8s
      fetch_libs: true
      exclude_paths: "tests .vendored"
    secrets:
      TICSAUTHTOKEN: ${{ secrets.TICSAUTHTOKEN }}

  analyze-machine:
    uses: canonical/identity-credentials-workflows/.github/workflows/tics-tox.yaml@43bece1429ac5793954edd57ad8f7a41ae578ab8
    with:
      project: vault-operator
      dir: machine
      fetch_libs: true
      exclude_paths: "tests .vendored"
    secrets:
      TICSAUTHTOKEN: ${{ secrets.TICSAUTHTOKEN }}
