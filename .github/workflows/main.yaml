name: CI

on:
  pull_request:
    branches: ["main", "release-*"]
    # CI decision applies labels before closure; architecture jobs retain a label fallback.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: ["main", "release-*"]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || github.ref == 'refs/heads/main' && format('ignore-main-{0}', github.run_id) || startsWith(github.ref, 'refs/heads/release-') && format('ignore-release-{0}', github.run_id) || format('ci-branch-{0}', github.ref_name) }}
  cancel-in-progress: true

jobs:
  ci-decision:
    name: CI decision
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-decision.yaml
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  ensure-shared-code-in-sync:
    needs: [ci-decision]
    if: >-
      !cancelled() && (needs.ci-decision.result != 'success' ||
      needs.ci-decision.outputs.shared_code != 'skip')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Vendor shared code into K8s charm
        working-directory: k8s
        run: make vendor-shared-code
      - name: Vendor shared code into machine charm
        working-directory: machine
        run: make vendor-shared-code
      - name: Ensure vendored code is checked in
        run: |
          STATUS=$(git status --porcelain)
          echo "$STATUS"
          test -z "$STATUS"

  k8s-quality:
    name: K8s Quality
    needs: [ci-decision, ensure-shared-code-in-sync]
    if: >-
      !cancelled() && (
      needs.ci-decision.result != 'success' ||
      needs.ci-decision.outputs.k8s_quality != 'skip') &&
      (needs.ensure-shared-code-in-sync.result == 'success' ||
      needs.ensure-shared-code-in-sync.result == 'skipped')
    runs-on: ubuntu-26.04
    steps:
      - uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.1.5
        with:
          workflows-ref: v3.1.3
      - uses: canonical/identity-credentials-workflows/.github/actions/setup-toolchains@v3.1.5
        with:
          working-directory: k8s
          toolchains: python charmcraft
          charmcraft-channel: latest/stable
      - name: Fetch charmcraft libs
        working-directory: k8s
        run: charmcraft fetch-libs
      - uses: canonical/identity-credentials-workflows/.github/actions/code-quality@v3.1.5
        with:
          working-directory: k8s
          python-enabled: "true"
      - uses: canonical/identity-credentials-workflows/.github/actions/unit-test@v3.1.5
        with:
          working-directory: k8s
          python-enabled: "true"

  k8s-grafana-dashboard-lint-report:
    # Dashboard validation is unchanged by a label-only event.
    if: github.event.action != 'labeled'
    uses: canonical/identity-credentials-workflows/.github/workflows/grafana-dashboard-lint-report.yaml@v3.1.5
    with:
      path: ./k8s/src/grafana_dashboards/*

  k8s-build:
    if: >-
      !cancelled() && (
      needs.ci-decision.result != 'success' ||
      needs.ci-decision.outputs.k8s_build != 'skip') &&
      needs.k8s-quality.result == 'success'
    needs: [ci-decision, k8s-quality]
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-build.yaml@v3.1.5
    with:
      path: k8s
      artifact-suffix: k8s

  k8s-build-arm:
    if: >-
      !cancelled() && (
      github.event_name == 'push' ||
      needs.ci-decision.outputs.k8s_arm == 'run' ||
      ((needs.ci-decision.result != 'success' || needs.ci-decision.outputs.k8s_arm == '') &&
      (contains(github.event.pull_request.labels.*.name, 'test-arm') ||
      contains(github.event.pull_request.labels.*.name, 'run-all-ci')))) &&
      needs.k8s-quality.result == 'success'
    needs: [ci-decision, k8s-quality]
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-build.yaml@v3.1.5
    with:
      path: k8s
      arch: arm64
      runner: '["self-hosted", "linux", "ARM64", "medium", "noble"]'
      artifact-suffix: k8s

  k8s-build-s390x:
    if: >-
      !cancelled() && (
      github.event_name == 'push' ||
      needs.ci-decision.outputs.k8s_s390x == 'run' ||
      ((needs.ci-decision.result != 'success' || needs.ci-decision.outputs.k8s_s390x == '') &&
      (contains(github.event.pull_request.labels.*.name, 'test-s390x') ||
      contains(github.event.pull_request.labels.*.name, 'run-all-ci')))) &&
      needs.k8s-quality.result == 'success'
    needs: [ci-decision, k8s-quality]
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-build.yaml@v3.1.5
    with:
      path: k8s
      arch: s390x
      runner: '["self-hosted-linux-s390x-noble-medium"]'
      artifact-suffix: k8s

  k8s-build-kv-requirer:
    needs: [ci-decision, k8s-quality]
    if: >-
      !cancelled() && (
      needs.ci-decision.result != 'success' ||
      needs.ci-decision.outputs.k8s_kv != 'skip') &&
      needs.k8s-quality.result == 'success'
    uses: ./.github/workflows/build-kv-requirer.yaml
    with:
      path: k8s
      artifact-name: kv-requirer-k8s-charm

  k8s-integration-test:
    if: >-
      !cancelled() && (
      needs.ci-decision.result != 'success' ||
      needs.ci-decision.outputs.k8s_integration != 'skip') &&
      needs.k8s-build.result == 'success' &&
      needs.k8s-build-kv-requirer.result == 'success'
    needs:
      - ci-decision
      - k8s-build
      - k8s-build-kv-requirer
    uses: ./.github/workflows/k8s-integration-test.yaml
    with:
      path: ./k8s/
      vault-charm-artifact-name: ${{ needs.k8s-build.outputs.artifacts-key }}
      kv-requirer-charm-artifact-name: kv-requirer-k8s-charm

  k8s-integration-test-arm:
    if: >-
      !cancelled() &&
      needs.k8s-build-arm.result == 'success' &&
      needs.k8s-build-kv-requirer.result == 'success'
    needs:
      - k8s-build-arm
      - k8s-build-kv-requirer
    uses: ./.github/workflows/k8s-integration-test-arm.yaml
    with:
      path: ./k8s/
      vault-charm-artifact-name: ${{ needs.k8s-build-arm.outputs.artifacts-key }}
      kv-requirer-charm-artifact-name: kv-requirer-k8s-charm

  k8s-integration-test-s390x:
    if: >-
      !cancelled() &&
      needs.k8s-build-s390x.result == 'success'
    needs:
      - k8s-build-s390x
    uses: ./.github/workflows/k8s-integration-test-s390x.yaml
    with:
      path: ./k8s/
      vault-charm-artifact-name: ${{ needs.k8s-build-s390x.outputs.artifacts-key }}

  k8s-publish-charm:
    name: Publish K8s Charm
    needs:
      - k8s-quality
      - k8s-integration-test
      - k8s-build
      - k8s-build-kv-requirer
    if: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'release-') }}
    permissions:
      contents: write
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-publish.yaml@v3.1.5
    secrets:
      CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
    with:
      destination_channel: 2.0/edge
      path: k8s
      artifacts-key: ${{ needs.k8s-build.outputs.artifacts-key }}
      charm-paths: ${{ needs.k8s-build.outputs.charm-paths }}
      tag-prefix: k8s

  k8s-publish-charm-arm:
    name: Publish K8s Charm (ARM)
    needs:
      - k8s-quality
      - k8s-integration-test-arm
      - k8s-build-arm
      - k8s-build-kv-requirer
    if: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'release-') }}
    permissions:
      contents: write
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-publish.yaml@v3.1.5
    secrets:
      CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
    with:
      destination_channel: 2.0/edge
      path: k8s
      artifacts-key: ${{ needs.k8s-build-arm.outputs.artifacts-key }}
      charm-paths: ${{ needs.k8s-build-arm.outputs.charm-paths }}
      tag-prefix: k8s
      runner: '["self-hosted", "linux", "ARM64", "medium", "noble"]'

  k8s-publish-charm-s390x:
    name: Publish K8s Charm (s390x)
    needs:
      - k8s-quality
      - k8s-build-s390x
      - k8s-integration-test-s390x
    if: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'release-') }}
    permissions:
      contents: write
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-publish.yaml@v3.1.5
    secrets:
      CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
    with:
      destination_channel: 2.0/edge
      path: k8s
      artifacts-key: ${{ needs.k8s-build-s390x.outputs.artifacts-key }}
      charm-paths: ${{ needs.k8s-build-s390x.outputs.charm-paths }}
      tag-prefix: k8s
      runner: '["self-hosted-linux-s390x-noble-medium"]'

  machine-quality:
    name: Machine Quality
    needs: [ci-decision, ensure-shared-code-in-sync]
    if: >-
      !cancelled() && (
      needs.ci-decision.result != 'success' ||
      needs.ci-decision.outputs.machine_quality != 'skip') &&
      (needs.ensure-shared-code-in-sync.result == 'success' ||
      needs.ensure-shared-code-in-sync.result == 'skipped')
    runs-on: ubuntu-26.04
    steps:
      - uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.1.5
        with:
          workflows-ref: v3.1.3
      - uses: canonical/identity-credentials-workflows/.github/actions/setup-toolchains@v3.1.5
        with:
          working-directory: machine
          toolchains: python charmcraft
          charmcraft-channel: latest/stable
      - name: Fetch charmcraft libs
        working-directory: machine
        run: charmcraft fetch-libs
      - uses: canonical/identity-credentials-workflows/.github/actions/code-quality@v3.1.5
        with:
          working-directory: machine
          python-enabled: "true"
      - uses: canonical/identity-credentials-workflows/.github/actions/unit-test@v3.1.5
        with:
          working-directory: machine
          python-enabled: "true"

  machine-grafana-dashboard-lint-report:
    # Dashboard validation is unchanged by a label-only event.
    if: github.event.action != 'labeled'
    uses: canonical/identity-credentials-workflows/.github/workflows/grafana-dashboard-lint-report.yaml@v3.1.5
    with:
      path: ./machine/src/grafana_dashboards/*

  machine-build:
    if: >-
      !cancelled() && (
      needs.ci-decision.result != 'success' ||
      needs.ci-decision.outputs.machine_build != 'skip') &&
      needs.machine-quality.result == 'success'
    needs: [ci-decision, machine-quality]
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-build.yaml@v3.1.5
    with:
      path: machine
      artifact-suffix: machine

  machine-build-arm:
    if: >-
      !cancelled() && (
      github.event_name == 'push' ||
      needs.ci-decision.outputs.machine_arm == 'run' ||
      ((needs.ci-decision.result != 'success' || needs.ci-decision.outputs.machine_arm == '') &&
      (contains(github.event.pull_request.labels.*.name, 'test-arm') ||
      contains(github.event.pull_request.labels.*.name, 'run-all-ci')))) &&
      needs.machine-quality.result == 'success'
    needs: [ci-decision, machine-quality]
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-build.yaml@v3.1.5
    with:
      path: machine
      arch: arm64
      runner: '["self-hosted", "linux", "ARM64", "medium", "noble"]'
      artifact-suffix: machine

  machine-build-s390x:
    if: >-
      !cancelled() && (
      github.event_name == 'push' ||
      needs.ci-decision.outputs.machine_s390x == 'run' ||
      ((needs.ci-decision.result != 'success' || needs.ci-decision.outputs.machine_s390x == '') &&
      (contains(github.event.pull_request.labels.*.name, 'test-s390x') ||
      contains(github.event.pull_request.labels.*.name, 'run-all-ci')))) &&
      needs.machine-quality.result == 'success'
    needs: [ci-decision, machine-quality]
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-build.yaml@v3.1.5
    with:
      path: machine
      arch: s390x
      runner: '["self-hosted-linux-s390x-noble-medium"]'
      artifact-suffix: machine

  machine-build-kv-requirer:
    needs: [ci-decision, machine-quality]
    if: >-
      !cancelled() && (
      needs.ci-decision.result != 'success' ||
      needs.ci-decision.outputs.machine_kv != 'skip') &&
      needs.machine-quality.result == 'success'
    uses: ./.github/workflows/build-kv-requirer.yaml
    with:
      path: machine
      artifact-name: kv-requirer-machine-charm

  machine-integration-test:
    if: >-
      !cancelled() && (
      needs.ci-decision.result != 'success' ||
      needs.ci-decision.outputs.machine_integration != 'skip') &&
      needs.machine-build.result == 'success' &&
      needs.machine-build-kv-requirer.result == 'success'
    needs:
      - ci-decision
      - machine-build
      - machine-build-kv-requirer
    uses: ./.github/workflows/machine-integration-test.yaml
    with:
      path: ./machine/
      vault-charm-artifact-name: ${{ needs.machine-build.outputs.artifacts-key }}
      kv-requirer-charm-artifact-name: kv-requirer-machine-charm

  machine-integration-test-arm:
    if: >-
      !cancelled() &&
      needs.machine-build-arm.result == 'success' &&
      needs.machine-build-kv-requirer.result == 'success'
    needs:
      - machine-build-arm
      - machine-build-kv-requirer
    uses: ./.github/workflows/machine-integration-test-arm.yaml
    with:
      path: ./machine/
      vault-charm-artifact-name: ${{ needs.machine-build-arm.outputs.artifacts-key }}
      kv-requirer-charm-artifact-name: kv-requirer-machine-charm

  machine-integration-test-s390x:
    if: >-
      !cancelled() &&
      needs.machine-build-s390x.result == 'success'
    needs:
      - machine-build-s390x
    uses: ./.github/workflows/machine-integration-test-s390x.yaml
    with:
      path: ./machine/
      vault-charm-artifact-name: ${{ needs.machine-build-s390x.outputs.artifacts-key }}

  machine-publish-charm:
    name: Publish Machine Charm
    needs:
      - machine-quality
      - machine-integration-test
      - machine-build
      - machine-build-kv-requirer
    if: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'release-') }}
    permissions:
      contents: write
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-publish.yaml@v3.1.5
    secrets:
      CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
    with:
      destination_channel: 2.0/edge
      path: machine
      artifacts-key: ${{ needs.machine-build.outputs.artifacts-key }}
      charm-paths: ${{ needs.machine-build.outputs.charm-paths }}
      tag-prefix: machine

  machine-publish-charm-arm:
    name: Publish Machine Charm (ARM)
    needs:
      - machine-quality
      - machine-build-arm
      - machine-integration-test-arm
      - machine-build-kv-requirer
    if: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'release-') }}
    permissions:
      contents: write
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-publish.yaml@v3.1.5
    secrets:
      CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
    with:
      destination_channel: 2.0/edge
      path: machine
      artifacts-key: ${{ needs.machine-build-arm.outputs.artifacts-key }}
      charm-paths: ${{ needs.machine-build-arm.outputs.charm-paths }}
      tag-prefix: machine
      runner: '["self-hosted", "linux", "ARM64", "medium", "noble"]'

  machine-publish-charm-s390x:
    name: Publish Machine Charm (s390x)
    needs:
      - machine-quality
      - machine-build-s390x
      - machine-integration-test-s390x
    if: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'release-') }}
    permissions:
      contents: write
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-publish.yaml@v3.1.5
    secrets:
      CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
    with:
      destination_channel: 2.0/edge
      path: machine
      artifacts-key: ${{ needs.machine-build-s390x.outputs.artifacts-key }}
      charm-paths: ${{ needs.machine-build-s390x.outputs.charm-paths }}
      tag-prefix: machine
      runner: '["self-hosted-linux-s390x-noble-medium"]'
