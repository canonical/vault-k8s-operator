name: Integration Tests

on:
  workflow_call:
    inputs:
      path:
        description: Path to the charm's root directory
        required: true
        type: string
      vault-charm-artifact-name:
        description: Name of the artifact to be downloaded for the vault charm
        required: true
        type: string
      kv-requirer-charm-artifact-name:
        description: Name of the artifact to be uploaded for the kv-requirer charm
        required: true
        type: string

jobs:
  integration-matrix:
    name: Define Integration tests matrix
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Generate matrix list
        id: suites
        run: |
          cd ${{ inputs.path }}
          list="$(find tests/integration -name 'test_*.py' -printf '%f\n' | jq -r -ncR '[inputs]')"
          echo "suites=$list"
          echo "suites=$list" >> "$GITHUB_OUTPUT"

  integration-tests:
    name: Integration Tests
    runs-on: [self-hosted, linux, X64, large, noble]
    needs: [integration-matrix]
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.integration-matrix.outputs.suites) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup operator environment
        uses: charmed-kubernetes/actions-operator@main
        with:
          juju-channel: 3.6/stable
          provider: lxd
          lxd-channel: 5.21/stable

      - name: Install UV and Tox
        run: |
          pipx uninstall tox
          sudo snap install astral-uv --classic
          uv tool install tox --with tox-uv --force
      - name: Fetch Charm Under Test
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.vault-charm-artifact-name }}
          path: ${{ inputs.path }}built/
      - name: Fetch KV Requirer Charm
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.kv-requirer-charm-artifact-name }}
          path: ${{ inputs.path }}built/
      - name: Get Charm Path
        id: charm-path
        working-directory: ${{ inputs.path }}
        run: |
          VAULT_CHARM=$(ls built/*.charm | grep -v kv-requirer | head -1)
          KV_CHARM=$(ls built/*kv-requirer*.charm | head -1)
          echo "vault-charm=${VAULT_CHARM}" >> "$GITHUB_OUTPUT"
          echo "kv-charm=${KV_CHARM}" >> "$GITHUB_OUTPUT"
      - name: Install TLS proxy for backup tests
        if: ${{ matrix.suite == 'test_backup_tls.py' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes socat
      - name: Install MicroCeph and configure RGW for backup tests
        if: ${{ matrix.suite == 'test_backup.py' || matrix.suite == 'test_backup_tls.py' }}
        run: |
          sudo snap install microceph
          sudo snap refresh --hold microceph
          sudo microceph cluster bootstrap
          sudo microceph disk add loop,4G,3

          health=""
          for i in $(seq 1 30); do
            health=$(sudo microceph.ceph health --format json | jq -r '.status')
            if [ "$health" = "HEALTH_OK" ]; then
              break
            fi
            echo "Waiting for cluster health... (attempt $i/30, current: $health)"
            sleep 10
          done
          if [ "$health" != "HEALTH_OK" ]; then
            echo "ERROR: Cluster did not become healthy after 300 seconds"
            exit 1
          fi

          sudo microceph enable rgw --port 7480

          rgw_ready=false
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:7480 | grep -q "200\|403"; then
              rgw_ready=true
              break
            fi
            echo "Waiting for RGW... (attempt $i/30)"
            sleep 5
          done
          if [ "$rgw_ready" != "true" ]; then
            echo "ERROR: RGW did not become ready after 150 seconds"
            exit 1
          fi

          sudo microceph.radosgw-admin user create \
            --uid=vaultmicrocephtest \
            --display-name="Vault MicroCeph Test" \
            --access-key=vaultmicrocephtest \
            --secret-key=vaultmicrocephtest

          sudo apt-get update
          sudo apt-get install --yes s3cmd
          s3cmd --access_key=vaultmicrocephtest \
            --secret_key=vaultmicrocephtest \
            --host=127.0.0.1:7480 \
            --host-bucket="127.0.0.1:7480/%(bucket)" \
            --no-ssl \
            mb s3://vault-microceph-test
      - name: Run integration tests
        working-directory: ${{ inputs.path }}
        run: |
          tox -e integration -- \
            --charm_path=${{ steps.charm-path.outputs.vault-charm }} \
            --kv_requirer_charm_path=${{ steps.charm-path.outputs.kv-charm }} \
            -k "${{ matrix.suite }}"
      - name: Archive charmcraft logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: charmcraft-logs-${{ matrix.suite }}
          path: /home/runner/.local/state/charmcraft/log/*.log
      - name: Archive juju crashdump
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: juju-crashdump-machine-${{ matrix.suite }}
          path: ${{ inputs.path }}/juju-crashdump-*.tar.xz

  aggregate-integration-results:
    name: Aggregate integration test results
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: always()
    steps:
      - name: Check matrix job results
        run: |
          # The 'needs' context contains the results of the jobs listed in 'needs:'
          job_result="${{ needs.integration-tests.result }}"

          echo "Result of $job_result"

          if [ "$job_result" == "success" ] || [ "$job_result" == "skipped" ]; then
            echo "Jobs concluded with success or skips."
            exit 0
          else
            echo "Jobs concluded with '$job_result'."
            exit 1
          fi
