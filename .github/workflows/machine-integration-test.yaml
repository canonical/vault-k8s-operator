name: Integration Tests

on:
  workflow_call:
    inputs:
      path:
        description: Path to the charm's root directory
        required: true
        type: string
      vault-charm-artifact-name:
        description: Name of the artifact to be downloaded for the vault charm
        required: true
        type: string
      kv-requirer-charm-artifact-name:
        description: Name of the artifact to be uploaded for the kv-requirer charm
        required: true
        type: string

jobs:
  integration-matrix:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
      - name: Select integration suites
        id: suites
        run: |
          suites="$(find '${{ inputs.path }}tests/integration' -maxdepth 1 -name 'test_*.py' -printf '%f\n' | sort | sed 's/\.py$//' | { printf 'smoke\n'; cat; } | jq -R . | jq -s -c .)"
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  integration-tests:
    name: Machine integration / ${{ matrix.suite }}
    needs: [integration-matrix]
    runs-on: [self-hosted, linux, X64, jammy, xlarge]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite: ${{ fromJSON(needs.integration-matrix.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Charm Under Test
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.vault-charm-artifact-name }}
          path: ${{ inputs.path }}built/

      - name: Get Charm Under Test Path
        id: charm-path
        run: echo "charm_path=$(find ${{ inputs.path }}built/ -name '*.charm' -type f -print)" >> $GITHUB_OUTPUT

      - name: Fetch KV Requirer Charm
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.kv-requirer-charm-artifact-name }}
          path: ${{ inputs.path }}kv-requirer/

      - name: Get KV Requirer Charm Path
        id: kv-requirer-charm-path
        run: echo "charm_path=$(find ${{ inputs.path }}kv-requirer/ -name '*.charm' -type f -print)" >> $GITHUB_OUTPUT

      - name: Setup operator environment
        uses: charmed-kubernetes/actions-operator@main
        with:
          juju-channel: 3.6/stable
          provider: lxd
          lxd-channel: 5.21/stable

      - name: Install UV and Tox
        run: |
          pipx uninstall tox
          sudo snap install astral-uv --classic
          uv tool install tox --with tox-uv --force

      - name: Install MicroCeph and configure RGW for backup tests
        if: ${{ matrix.suite == 'test_backup_microceph' }}
        run: |
          echo "Installing MicroCeph snap..."
          sudo snap install microceph
          sudo snap refresh --hold microceph

          echo "Bootstrapping MicroCeph cluster..."
          sudo microceph cluster bootstrap

          echo "Adding loop-file backed OSDs..."
          sudo microceph disk add loop,4G,3

          echo "Waiting for MicroCeph cluster to be healthy..."
          sudo microceph.ceph status
          health=""
          for i in $(seq 1 30); do
            health=$(sudo microceph.ceph health --format json | jq -r '.status')
            if [ "$health" = "HEALTH_OK" ]; then
              echo "Cluster is healthy."
              break
            fi
            echo "Waiting for cluster health... (attempt $i/30, current: $health)"
            sleep 10
          done
          if [ "$health" != "HEALTH_OK" ]; then
            echo "ERROR: Cluster did not become healthy after 300 seconds"
            exit 1
          fi

          echo "Enabling RGW (S3-compatible gateway) on port 7480..."
          sudo microceph enable rgw --port 7480

          echo "Waiting for RGW to be ready..."
          rgw_ready=false
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:7480 | grep -q "200\|403"; then
              echo "RGW is responding."
              rgw_ready=true
              break
            fi
            echo "Waiting for RGW... (attempt $i/30)"
            sleep 5
          done
          if [ "$rgw_ready" != "true" ]; then
            echo "ERROR: RGW did not become ready after 150 seconds"
            exit 1
          fi

          echo "Creating S3 user for Vault integration tests..."
          sudo microceph.radosgw-admin user create \
            --uid=vaultmicrocephtest \
            --display-name="Vault MicroCeph Test" \
            --access-key=vaultmicrocephtest \
            --secret-key=vaultmicrocephtest

          echo "Creating S3 bucket..."
          sudo apt-get install -y -qq s3cmd > /dev/null
          s3cmd --access_key=vaultmicrocephtest \
            --secret_key=vaultmicrocephtest \
            --host=127.0.0.1:7480 \
            --host-bucket="127.0.0.1:7480/%(bucket)" \
            --no-ssl \
            mb s3://vault-microceph-test

          echo "MicroCeph RGW setup complete."
          sudo microceph status
      - name: Run integration tests
        run: |
          mv ${{ steps.charm-path.outputs.charm_path }} ${{ inputs.path }}vault.charm
          mv ${{ steps.kv-requirer-charm-path.outputs.charm_path }} ${{ inputs.path }}kv-requirer.charm
          cd ${{ inputs.path }}
          selector=("tests/integration/${{ matrix.suite }}.py")
          if [ "${{ matrix.suite }}" = smoke ]; then selector=(tests/integration -m smoke); fi
          tox -e integration -- \
            --charm_path=./vault.charm \
            --kv_requirer_charm_path=./kv-requirer.charm \
            "${selector[@]}"
